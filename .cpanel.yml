---
deployment:
  tasks:
    - export DEPLOYPATH=/home/qzmivzbj/app.msdieu.com
    - export DATAPATH=/home/qzmivzbj/app-data/vhomework
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/mkdir -p $DATAPATH
    - /bin/rm -f $DEPLOYPATH/index.html
    - /bin/rm -rf $DEPLOYPATH/assets
    - /bin/cp -Rf dist/client/* $DEPLOYPATH/
    - /bin/rm -rf $DEPLOYPATH/dist
    - /bin/cp -Rf dist $DEPLOYPATH/
    - /bin/mkdir -p $DEPLOYPATH/scripts
    - /bin/cp -Rf scripts/*.mjs $DEPLOYPATH/scripts/
    - /bin/cp -f app.js package.json package-lock.json $DEPLOYPATH/
